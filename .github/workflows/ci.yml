name: CI
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb espeak-ng
      - run: npm ci
      - run: npm run typecheck
      - name: Built-in transcription engine (whisper.cpp, static build of the pinned tag)
        run: node scripts/fetch-whisper.mjs
      - name: Neural speech denoiser (DeepFilterNet3 via deep-filter-rt, MIT/Apache, model embedded)
        run: |
          rustup update stable
          cargo build --release --locked --manifest-path tools/denoise/Cargo.toml
          mkdir -p vendor/denoise && cp tools/denoise/target/release/primestone-denoise vendor/denoise/
      - name: Cache the official Whisper small model
        uses: actions/cache@v4
        with: { path: '${{ runner.temp }}/models', key: whisper-ggml-small-55356645c2b361a969dfd0ef2c5a50d530afd8d5 }
      - name: Official Whisper small model (SHA-1 from whisper.cpp models/README.md)
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          f="$RUNNER_TEMP/models/ggml-small.bin"
          [ -f "$f" ] || curl -sSL -o "$f" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin
          echo "55356645c2b361a969dfd0ef2c5a50d530afd8d5  $f" | sha1sum -c -
      - run: npm test
        env: { PRIMESTONE_WHISPER_MODEL: '${{ runner.temp }}/models/ggml-small.bin' }
      - run: npm run build
      - run: xvfb-run -a -s "-screen 0 1600x1000x24" npx playwright test --trace off

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: FFmpeg LGPL (no GPL component; exports use the graphics card or AV1/VP9 on the processor)
        run: node scripts/fetch-ffmpeg.mjs lgpl
      - name: Built-in transcription engine (whisper.cpp, static build of the pinned tag)
        run: node scripts/fetch-whisper.mjs
      - name: Neural speech denoiser (DeepFilterNet3 via deep-filter-rt, MIT/Apache, model embedded)
        shell: pwsh
        run: |
          rustup update stable
          cargo build --release --locked --manifest-path tools/denoise/Cargo.toml
          New-Item -ItemType Directory -Force vendor/denoise | Out-Null
          Copy-Item tools/denoise/target/release/primestone-denoise.exe vendor/denoise/
      - name: Unit + integration tests (bundled FFmpeg)
        env: { PRIMESTONE_FFMPEG_DIR: '${{ github.workspace }}\vendor\ffmpeg' }
        run: npm test
      - run: npm run build
      - name: End-to-end tests
        env: { PRIMESTONE_FFMPEG_DIR: '${{ github.workspace }}\vendor\ffmpeg' }
        run: npx playwright test --trace off
      - name: Package installer
        run: npx electron-builder --win --x64 --publish never
      - name: Install silently, self-test the installed app, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter *.exe | Where-Object { $_.Name -like '*Setup*' } | Select-Object -First 1
          Write-Host "Installer: $($setup.Name) ($([math]::Round($setup.Length/1MB,1)) MB)"
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Primestone Motion Studio.exe' | Select-Object -First 1
          if (-not $exe) { throw 'installed executable not found' }
          Write-Host "Installed: $($exe.FullName)"
          $out = "$env:RUNNER_TEMP\self-test.json"
          $t = Start-Process $exe.FullName -ArgumentList '--self-test', $out -Wait -PassThru
          Get-Content $out
          if ($t.ExitCode -ne 0) { throw "self-test failed ($($t.ExitCode))" }
          $dir = $exe.DirectoryName
          $un = Get-ChildItem $dir -Filter 'Uninstall*.exe' | Select-Object -First 1
          $u = Start-Process $un.FullName -ArgumentList '/S' -Wait -PassThru
          # the NSIS uninstaller re-launches itself from %TEMP%: wait for the files to go
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir 'Primestone Motion Studio.exe')); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dir 'Primestone Motion Studio.exe')) { throw 'uninstall left the application in place' }
          Write-Host 'Uninstalled cleanly'
      - uses: actions/upload-artifact@v4
        with:
          name: primestone-windows-installer
          path: release/*.exe
