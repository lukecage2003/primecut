[package]
name = "primestone-denoise"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Primestone: speech denoising with DeepFilterNet3 (deep-filter-rt), raw f32 48 kHz mono in, out"

[dependencies]
deep-filter-rt = "0.2.0"
ndarray = "0.17"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
